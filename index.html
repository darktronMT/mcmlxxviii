<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111010">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="MCMLXXVIII. The Creator. The Maker. The Architect.">
  <meta name="robots" content="index, follow">
  <title>MCMLXXVIII — The Offer</title>
  <style>
    :root { color-scheme:dark; --paper:#f2eee8; --faded:#92908d; --ember:#d96517; --night:#111010; }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--night); }
    body { min-height:100svh; margin:0; display:flex; flex-direction:column; overflow-x:hidden; color:var(--paper); background:radial-gradient(ellipse 55% 55% at 50% 47%,#1c1918 0%,#111010 73%); font-family:Georgia,'Times New Roman',serif; }
    a { color:inherit; }
    .masthead, .base { display:flex; align-items:center; justify-content:space-between; gap:24px; width:100%; padding:30px clamp(22px,5vw,82px); }
    .masthead { font:500 10px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; letter-spacing:.22em; color:var(--faded); }
    .masthead .mark { display:flex; align-items:center; gap:12px; }
    .masthead .dot { width:5px; height:5px; border-radius:50%; background:var(--ember); box-shadow:0 0 17px rgba(217,101,23,.4); }
    main { flex:1; width:min(960px,100%); margin:auto; display:flex; align-items:center; justify-content:center; padding:74px 24px 85px; }
    .hero { width:100%; text-align:center; }
    .eyebrow { margin:0 0 42px; color:var(--faded); font:500 10px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace; letter-spacing:.34em; text-transform:uppercase; }
    .signature { width:min(730px,100%); display:block; margin:0 auto; filter:drop-shadow(0 10px 26px rgba(0,0,0,.12)); }
    .separator { height:1px; width:58px; margin:49px auto 39px; background:var(--ember); }
    h1 { font-weight:400; font-size:clamp(24px,4.3vw,51px); line-height:1.25; letter-spacing:-.025em; max-width:860px; margin:0 auto 28px; }
    .support { margin:0 auto; max-width:690px; color:#c2bcb5; font-size:clamp(13px,1.55vw,17px); line-height:1.7; letter-spacing:.025em; }
    .fine { margin:60px 0 0; color:var(--faded); text-transform:uppercase; letter-spacing:.32em; font:500 10px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .base { color:var(--faded); font:500 10px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace; letter-spacing:.13em; border-top:1px solid #ffffff10; }
    .base strong { color:#c2bcb5; font-weight:500; }
    .base .line { color:var(--ember); }
    @media(max-width:650px) {
      .masthead,.base { padding:23px 22px; font-size:9px; }
      .masthead .right { display:none; }
      main { padding:66px 22px 78px; }
      .eyebrow { margin-bottom:32px; }
      .separator { margin:37px auto 31px; }
      .fine { margin-top:48px; letter-spacing:.17em; }
      .base { flex-direction:column; align-items:flex-start; gap:4px; }
    }
    @media(prefers-reduced-motion: no-preference) {
      .hero { animation:arrive .85s cubic-bezier(.2,.85,.22,1) both; }
      @keyframes arrive {from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
    }
  </style>
</head>
<body>
  <header class="masthead" aria-label="Site header">
    <div class="mark"><span class="dot" aria-hidden="true"></span><span>THE PRIVATE INDEX / 001</span></div>
    <span class="right">NO NAME. JUST A MARK.</span>
  </header>
  <main>
    <div class="hero">
      <p class="eyebrow">A SIGNATURE WITHOUT AN EXPLANATION</p>
      <img class="signature" src="signature-negative.svg" width="864" height="106" alt="MCMLXXVIII" fetchpriority="high">
      <div class="separator" aria-hidden="true"></div>
      <h1>Make me an offer I can't refuse.</h1>
      <p class="support">Some things are better left unsaid.</p>
      <p class="fine">THE CREATOR. THE MAKER. THE ARCHITECT.</p>
    </div>
  </main>
  <footer class="base">
    <span>MCMLXXVIII <span class="line">/</span> PRIVATE MARK</span>
    <strong>NO TRANSACTIONS. NO PROMISES.</strong>
  </footer>
</body>
</html>
